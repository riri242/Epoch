name: Epoch research validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,dashboard]"
      - name: Run regression tests
        run: python -m pytest -q
      - name: Reproduce research results
        run: python scripts/run_all.py
      - name: Save measured results and scientific report
        uses: actions/upload-artifact@v4
        with:
          name: epoch-results
          path: results/
          if-no-files-found: error
