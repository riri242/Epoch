name: Epoch experiment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Download benchmark
        run: python scripts/download_data.py
      - name: Audit temporal data
        run: python scripts/audit_data.py
      - name: Run experiment
        run: python scripts/run_experiment.py
      - name: Compare with and without day
        run: python scripts/run_sensitivity.py
      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: epoch-results
          path: results/
